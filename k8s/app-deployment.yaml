apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: licitaciones-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: licitaciones-app
  template:
    metadata:
      labels:
        app: licitaciones-app
    spec:
      containers:
        - name: licitaciones-app
          image: licitaciones-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ConnectionStrings__DefaultConnection
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Sondas desactivadas temporalmente mientras no exista /health
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   failureThreshold: 10
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   initialDelaySeconds: 5
          #   periodSeconds: 5